[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustbadge"
version = "1.0.0"
description = "One badge. Every check behind it. Aggregate AgentForge JSON reports into a single trust score + README badge."
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
trustbadge = "trustbadge:main"

[tool.setuptools]
py-modules = ["trustbadge"]
package-dir = {"" = "src"}
